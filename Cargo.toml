[package]
name = "textpoppup"
version = "0.1.4"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
